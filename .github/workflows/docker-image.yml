name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # required for pushing to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image namespace
        id: img
        # A pull request from a fork gets no repository secrets, so the
        # namespace has to fall back to the repository owner.
        run: echo "namespace=$(printf '%s' "${NAME:-${{ github.repository_owner }}}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        env:
          NAME: ${{ secrets.NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }} # push only on branch push, not PR
          platforms: linux/amd64
          tags: ghcr.io/${{ steps.img.outputs.namespace }}/gow-zorin:latest
